apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gearflow
resources:
  - ../base
  - infrastructure.yaml
patches:
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: gearflow-billing
  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: gearflow-billing
  - target:
      kind: Deployment
      name: gearflow-billing
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/strategy
        value: {type: Recreate}
  - target:
      kind: PersistentVolumeClaim
      name: gearflow-billing-keys
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: [ReadWriteOnce]
      - op: add
        path: /spec/storageClassName
        value: gearflow-gp3
  - target:
      kind: ConfigMap
      name: gearflow-billing
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gearflow-billing
      data:
        ASPNETCORE_ENVIRONMENT: Development
        Billing__PublicBaseUrl: http://localhost:5080
        RabbitMq__Port: "5672"
        RabbitMq__Tls: "false"
        RabbitMq__QueueType: classic
        Email__Host: mailpit
        Email__Port: "1025"
        Email__EnableSsl: "false"
        Telemetry__Enabled: "false"
