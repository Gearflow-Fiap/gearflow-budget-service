# Academy demonstration only: single instances, internal services, Mongo without authentication.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gearflow-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: v1
kind: Service
metadata:
  name: billing-mongo
spec:
  clusterIP: None
  selector: {app: billing-mongo}
  ports: [{name: mongo, port: 27017}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-mongo
spec:
  serviceName: billing-mongo
  replicas: 1
  selector:
    matchLabels: {app: billing-mongo}
  template:
    metadata:
      labels: {app: billing-mongo}
    spec:
      containers:
        - name: mongo
          image: mongo:7.0.16
          args: [--replSet, rs0, --bind_ip_all, --wiredTigerCacheSizeGB, "0.25"]
          ports: [{name: mongo, containerPort: 27017}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          readinessProbe:
            exec:
              command: [mongosh, --quiet, --eval, "if(!db.adminCommand('ping').ok) quit(1)"]
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts: [{name: data, mountPath: /data/db}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        storageClassName: gearflow-gp3
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  clusterIP: None
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672}
    - {name: management, port: 15672}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      securityContext: {fsGroup: 999}
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2.0-management
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: {name: gearflow-billing-secrets, key: RabbitMq__Username}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: gearflow-billing-secrets, key: RabbitMq__Password}
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_running]
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        storageClassName: gearflow-gp3
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: {app: mailpit}
  ports:
    - {name: smtp, port: 1025}
    - {name: web, port: 8025}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: {app: mailpit}
  template:
    metadata:
      labels: {app: mailpit}
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.21.8
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: web, containerPort: 8025}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
