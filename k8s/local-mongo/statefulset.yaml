# Development example only. Production must use authenticated, backed-up replica set infrastructure.
apiVersion: v1
kind: Service
metadata:
  name: billing-mongo
  namespace: gearflow
spec:
  clusterIP: None
  selector: {app: billing-mongo-local}
  ports: [{name: mongo, port: 27017}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-mongo
  namespace: gearflow
spec:
  serviceName: billing-mongo
  replicas: 1
  selector:
    matchLabels: {app: billing-mongo-local}
  template:
    metadata:
      labels: {app: billing-mongo-local}
    spec:
      containers:
        - name: mongo
          image: mongo:7.0.16
          args: [--replSet, rs0, --bind_ip_all]
          ports: [{name: mongo, containerPort: 27017}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            exec:
              command: [mongosh, --quiet, --eval, "if(!db.adminCommand('ping').ok) quit(1)"]
          volumeMounts: [{name: data, mountPath: /data/db}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: billing-mongo-init
  namespace: gearflow
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7.0.16
          command: [mongosh, --host, billing-mongo-0.billing-mongo:27017, --quiet, --eval]
          args:
            - "try { rs.status() } catch(e) { if(e.codeName === 'NotYetInitialized') rs.initiate({_id:'rs0',members:[{_id:0,host:'billing-mongo-0.billing-mongo.gearflow.svc.cluster.local:27017'}]}); else throw e; }"
